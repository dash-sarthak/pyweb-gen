[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyweb-gen"
version = "1.0.0"
description = "A minimal static blog generator"
readme = "README.md"
requires-python = ">=3.11"

authors = [{ name = "Sarthak Dash" }]
dependencies = [
    "jinja2==3.1.6",
    "markdown-it-py==4.2.0",
    "python-frontmatter==1.3.0",
]

[project.scripts]
pyweb-gen = "pyweb_gen.cli:main"

[tool.setuptools.package-data]
pyweb_gen = ["scaffold/**/*"]

[tool.setuptools.packages.find]
include = ["pyweb_gen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["frontmatter", "markdown_it"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
